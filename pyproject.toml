[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-oop"
version = "0.1.0"
description = "A command-line To-Do application built with OOP in Python."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "python-dotenv>=1.2.4",
]

[project.scripts]
todo = "main:main"

[tool.setuptools.packages.find]
where = ["src"]